<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Task Management</title>
</head>

<body>

    <header class="bg-slate-700/90 text-center p-6">
        <h1 class="text-3xl text-white font-bold p-2">Task Manager</h1>
    </header>

    <main class="bg-linear-to-r bg-gray-400/70 to-gray-300 p-1">

        <section class="p-1">
            <h2 class="text-2xl text-sky-700 font-bold p-2 border-b-2 rounded-lg">Task Management</h2>
            <form class="border border-gray-400 p-4 rounded-lg mt-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="grid grid-cols-1">
                        <label for="task-name" class="font-semibold text-lg text-slate-700">
                            Task Name <span class="text-red-600">*</span>
                        </label>
                        <input id="task-name" class="bg-slate-400/70 text-gray-300 py-2 px-4 rounded-lg font-semibold" type="text" placeholder="Enter task name..." />
                    </div>

                    <div class="grid grid-cols-1">
                        <label for="priority" class="font-semibold text-lg text-slate-700">
                            Priority <span class="text-red-600">*</span>
                        </label>
                        <select id="priority" class="bg-slate-400/70 text-gray-300 py-2 px-4 rounded-lg font-semibold"  required>
                            <option value="">Choose...</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1">
                        <label for="due-date" class="font-semibold text-lg text-slate-700">Due Date</label>
                        <input id="due-date" class="bg-slate-400/70 text-gray-300 py-2 px-4 rounded-lg font-semibold"  type="date" />
                    </div>

                    <div class="grid grid-cols-1">
                        <label for="status" class="font-semibold text-lg text-slate-700">
                            Status <span class="text-red-600">*</span>
                        </label>
                        <select id="status" class="bg-slate-400/70 text-gray-300 py-2 px-4 rounded-lg font-semibold"  required>
                            <option value="">Choose a status...</option>
                            <option value="in-progress">In Progress</option>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                </div>

                <div class="text-right mt-4">
                    <button onclick="addTask()" id="btn-addTask" type="button" class="bg-blue-500 text-white py-2 px-5 rounded-lg hover:bg-blue-600 ">Add Task</button>
                    <button onclick="updateTask()" id="btn-updateTask" type="button" class="bg-yellow-600 text-white py-2 px-5 rounded-lg hover:bg-yellow-700 hidden">Update Task</button>
                    <button onclick="resetForm()" class="bg-gray-300 text-white py-2 px-5 rounded-lg hover:bg-gray-600">Cancel</button>
                </div>
            </form>
        </section>

        <!-- dashboard -->
        <section class="p-1">
            <h2 class="text-2xl text-sky-700 font-bold p-2 border-b-2 rounded-lg">Dashboard</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                <div class="border-l-5 border-orange-500 rounded-lg py-3 px-5 bg-orange-100/30 shadow-lg">
                    <h3 class="text-fuchsia-600 text-center font-bold text-lg">All Tasks</h3>
                    <p class="text-center font-bold text-2xl" id="total-task">0</p>
                </div>
                <div class="border-l-5 border-orange-500 rounded-lg py-3 px-5 bg-orange-100/30 shadow-lg">
                    <h3 class="text-yellow-600 text-center font-bold text-lg">Pending</h3>
                    <p class="text-center font-bold text-2xl" id="total-pending">0</p>
                </div>
                <div class="border-l-5 border-orange-500 rounded-lg py-3 px-5 bg-orange-100/30 shadow-lg">
                    <h3 class="text-teal-600 text-center font-bold text-lg">In Progress</h3>
                    <p class="text-center font-bold text-2xl" id="total-inProgress">0</p>
                </div>
                <div class="border-l-5 border-orange-500 rounded-lg py-3 px-5 bg-orange-100/30 shadow-lg">
                    <h3 class="text-green-600 text-center font-bold text-lg">Completed</h3>
                    <p class="text-center font-bold text-2xl" id="total-complete">0</p>
                </div>
            </div>
        </section>

        <section class="p-1">
            <h2 class="text-2xl text-sky-700 font-bold p-2 border-b-2 rounded-lg">Task List</h2>
            <div class="overflow-x-auto rounded-t-lg mt-4">
                <table class="w-full border-collapse text-lef">
                    <thead class="bg-slate-700 text-white ">
                        <tr>
                            <th class="whitespace-nowrap py-3 px-4 text-left">ID</th>
                            <th class="whitespace-nowrap py-3 px-4 text-left">Task</th>
                            <th class="whitespace-nowrap py-3 px-4 text-left">Priority</th>
                            <th class="whitespace-nowrap py-3 px-4 text-left">Due Date</th>
                            <th class="whitespace-nowrap py-3 px-4 text-left">Status</th>
                            <th class="whitespace-nowrap py-3 px-4 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="render-list-data">
                    </tbody>
                </table>
            </div>
        </section>

    </main>
<script src="script.js"></script>
</body>
</html>
